name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML components and schemas
        run: python tools/validate_yaml.py

      - name: Check naming migration
        run: python tools/check_naming.py

      - name: Check documentation links
        run: python tools/check_links.py
