risk_analyzer:
  character_drift:
    low: single character fixed shot
    medium: character in motion
    high: transformation / costume change

  action_complexity:
    level_1:
      label: stable
      examples: [standing, head turn, smile, wave]
    level_2:
      label: acceptable
      examples: [weapon draw, ability release, walk toward camera]
    level_3:
      label: high risk
      examples: [continuous combat, high speed movement, flips, flying]
    level_4:
      label: forbidden
      examples: [group battle, complex transformation, large scale destruction]
    max_action_level:
      5s: 1
      15s: 2
      30s: 3

  camera_stability:
    stable: [slow push, pan, closeup, hero shot, 2.5D parallax]
    risky: [360 orbit, high speed tracking, complex movement]
    max_camera_transition:
      15s: 4

  effect_level:
    0: none
    1: light effect
    2: particles
    3: ability burst
    4: environmental destruction
    limits:
      15s_character_pv: 2
      legendary: 3

  output_format:
    risk_report:
      overall_risk:
      failure_probability:
      problem:
