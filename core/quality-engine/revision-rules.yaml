stability_rules:
  rule_01:
    title: 优先降低动作，不降低角色
    wrong: remove character showcase
    right: reduce combat action to preparation action
  rule_02:
    title: 优先减少特效，不减少技能
    wrong: giant explosion
    right: energy gathering + character pose + signature effect
  rule_03:
    title: 优先保留镜头节奏，降低单镜头复杂度
    wrong: 砍掉快切、拉长单镜头、退回固定机位
    right: 保留镜头数量与快切节奏，降低单镜头内的动作 / 特效 / 运镜复杂度

auto_revision:
  - trigger: generation_stability < 40
    actions:
      - reduce action complexity
      - reduce effect level
      - reduce within-shot camera movement, keep cut rhythm
  - trigger: character_consistency < 20
    actions:
      - add character lock
      - add appearance anchor
      - add negative prompt
  - trigger: commercial_value low
    actions:
      - add beauty-showcase
      - add hero-pose
      - add title-reveal

feedback_loop: >
  Composer -> Shot Plan -> Quality Check -> Risk Analyzer -> Revision -> Final Shot Plan
