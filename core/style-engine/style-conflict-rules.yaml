conflict_rules:
  - id: conflict.001
    styles:
      - y2k-graphic
      - dark-cinematic-cel
    level: C
    reason: >
      visual_language_conflict: bright playful graphic vs dark dramatic cinematic
    resolution:
      keep: character_identity
      remove: y2k-graphic
      add: fantasy-anime

  - id: conflict.002
    styles:
      - retro-cel
      - mobile-game-premium
    level: B
    reason: different rendering philosophy
    resolution:
      choose_based_on: goal (nostalgia vs commercial polish)

  - id: conflict.003
    styles:
      - sweet-y2k-release
      - heavy-battle-style
    level: B
    resolution:
      reduce: combat intensity
      keep: character charm
