# AstraForge Visual Component Library — Theme
# Theme 解决「这个角色应该以什么商业身份出现？」

components:
  - id: theme.character.release.v1
    slug: character-release
    name: Mobile Game Character Release
    category: mobile_character_pv
    purpose: new character launch
    commercial_goal: make audience remember character
    target_duration: 15s
    structure:
      shot1: { purpose: hook, content: [eye reveal, signature feature] }
      shot2: { purpose: identity, content: [face, hair, outfit, accessory] }
      shot3: { purpose: showcase, content: [personality action, signature ability] }
      shot4: { purpose: climax, content: [hero pose, visual effect] }
      shot5: { purpose: ending, content: [character title, final frame] }
    recommended_camera: [reveal_closeup, beauty_showcase, hero_low_angle]
    recommended_action: [signature_gesture, ability_release, signature_pose]
    recommended_expression: [cool_gaze, sweet_smile]
    recommended_transition: [anime_flash_cut, ui_card, title_reveal]
    # 概念分解图规范矩阵（见 director/character-concept-sheet.md）
    # 本主题为性别中立基础发布主题，用于非二元 / 中性角色；背景可在白底与羊皮纸间按气质二选一。
    concept_sheet:
      clothing_layers: [主外套, 内搭上衣, 下装（长裤/半身裙二选一）, 鞋履, 颈/腰饰, 随身包]
      inner_layer_state: 脱去主外套展示内搭与下装层次
      intimate_innerwear: [打底衫, 打底裤/打底裙, 袜类]
      expression_set: [composed-gaze, elegant-smile, confident-smirk, sweet-smile]
      material_closeups: [主面料肌理, 金属/皮质配饰反光, 标志纹样]
      life_slice:
        bags: 随身包袋：笔记本、充电宝、钢笔/口红二选一、钥匙、便签
        care: [护手霜, 香水/发蜡, 首饰/发饰盒]
        private: [手账本, 收藏徽章/盲盒, 常备药品, 明信片]
    risk: low

  - id: theme.gacha.legendary.v1

    slug: gacha-legendary
    name: Legendary Character Reveal
    purpose: create rarity feeling
    commercial_goal: increase collection desire
    visual_keywords: [premium, legendary, exclusive, rare]
    structure:
      opening: silhouette reveal
      middle: character beauty showcase
      climax: signature ability
      ending: character card reveal
    recommended_camera: [eye_reveal, detail_macro, final_pose]
    recommended_action: [transformation, ability_release, signature_pose]
    recommended_transition: [particle_reveal, ui_card, title_reveal]
    best_for: [limited character, SSR character, special banner]
    # 概念分解图规范矩阵（见 director/character-concept-sheet.md）
    # 本主题为性别中立传奇揭示主题，用于非二元 / 中性角色；背景可在白底与羊皮纸间按气质二选一。
    concept_sheet:
      clothing_layers: [华丽主衣, 披风/外罩, 战靴/礼靴, 贵金属配饰, 头冠/额饰, 武器挂链]
      inner_layer_state: 解外罩展示主衣与内衬
      intimate_innerwear: [打底衫, 打底裤/打底裙, 长袜]
      expression_set: [confident-smirk, cool-gaze, elegant-smile, detached-stare]
      material_closeups: [缎面/绒面流光, 宝石镶嵌, 金属法器反光]
      life_slice:
        bags: 宝匣/腰囊：符文卷、信物、星砂瓶
        care: [香水, 护手霜, 银饰盒]
        private: [收藏宝石, 手账本, 常备药品, 明信片]
    risk: medium

