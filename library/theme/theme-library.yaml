# AstraForge Visual Component Library — Theme
# Theme 解决「这个角色应该以什么商业身份出现？」

components:
  - id: theme.character.release.v1
    slug: character-release
    name: Mobile Game Character Release
    category: mobile_character_pv
    purpose: new character launch
    commercial_goal: make audience remember character
    target_duration: 15s
    structure:
      shot1: { purpose: hook, content: [eye reveal, signature feature] }
      shot2: { purpose: identity, content: [face, hair, outfit, accessory] }
      shot3: { purpose: showcase, content: [personality action, signature ability] }
      shot4: { purpose: climax, content: [hero pose, visual effect] }
      shot5: { purpose: ending, content: [character title, final frame] }
    recommended_camera: [reveal_closeup, beauty_showcase, hero_low_angle]
    recommended_action: [signature_gesture, ability_release, signature_pose]
    recommended_expression: [cool_gaze, sweet_smile]
    recommended_transition: [anime_flash_cut, ui_card, title_reveal]
    risk: low

  - id: theme.gacha.legendary.v1

    slug: gacha-legendary
    name: Legendary Character Reveal
    purpose: create rarity feeling
    commercial_goal: increase collection desire
    visual_keywords: [premium, legendary, exclusive, rare]
    structure:
      opening: silhouette reveal
      middle: character beauty showcase
      climax: signature ability
      ending: character card reveal
    recommended_camera: [eye_reveal, detail_macro, final_pose]
    recommended_action: [transformation, ability_release, signature_pose]
    recommended_transition: [particle_reveal, ui_card, title_reveal]
    best_for: [limited character, SSR character, special banner]
    risk: medium

  - id: theme.cool.female.jrpg.v1

    slug: cool-female-jrpg
    name: Cool Female JRPG Hero
    character_type: cool_female
    commercial_position: [power, elegance, confidence]
    visual_keywords: [silver hair, sharp eyes, elegant weapon, strong silhouette]
    structure:
      opening: eye reveal
      middle: [weapon, outfit, character attitude]
      climax: ability display
      ending: hero pose
    camera: [eye_reveal, beauty_showcase, hero_low_angle]
    action: [confident_walk, weapon_reveal, ability_release]
    expression: [cool_gaze, confident_smirk]
    transition: [flash_cut, anime_impact, title_reveal]
    risk: low

  - id: theme.sweet.y2k.v1

    slug: sweet-y2k-girl
    name: Sweet Y2K Character
    character_type: cute_fashion
    commercial_position: [charm, fashion, personality]
    visual_keywords: [pink, trendy, playful, energetic]
    structure:
      opening: face interaction
      middle: fashion showcase
      climax: signature gesture
      ending: cute hero frame
    camera: [hand_to_camera, beauty_showcase]
    action: [hair_flip, hand_gesture]
    expression: [playful_wink, sweet_smile]
    transition: [graphic_panel, ui_card]
    balance_rule: { character_priority: 70%, graphic_element: 30% }
    risk: low

  - id: theme.academy.character.v1

    slug: academy-character
    name: Academy Character Introduction
    commercial_position: [personality, emotion, daily charm]
    visual_keywords: [school, character profile, youth]
    structure:
      opening: character file reveal
      middle: daily life detail
      climax: personality moment
      ending: character card
    camera: [beauty_showcase, detail_macro]
    action: [head_turn, hand_gesture]
    expression: [shy_expression, sweet_smile]
    transition: [graphic_panel, ui_card]
    risk: low

  - id: theme.magic.girl.v1

    slug: magic-girl
    name: Magic Girl Release
    commercial_position: [fantasy, wonder, special ability]
    visual_keywords: [magical energy, transformation, particles]
    structure:
      opening: symbol reveal
      middle: character beauty
      climax: magic ability
      ending: hero title
    camera: [eye_reveal, hero_low_angle]
    action: [transformation, ability_release]
    expression: [elegant_smile]
    transition: [particle_reveal, title_reveal]
    risk: medium

  - id: theme.cyberpunk.girl.v1

    slug: cyberpunk-girl
    name: Cyberpunk Female Character
    commercial_position: [technology, coolness, future identity]
    visual_keywords: [neon, hacker, digital]
    structure:
      opening: data scan
      middle: character reveal
      climax: ability activation
      ending: digital title
    camera: [detail_macro, hand_to_camera, hero_low_angle]
    action: [hand_gesture, ability_release]
    expression: [confident_smirk]
    transition: [glitch_data, ui_card]
    risk: medium

  - id: theme.dark.witch.release.v1

    slug: dark-witch-release
    name: Dark Witch Release
    commercial_position: [mystery, fantasy appeal, elegance]
    visual_keywords: [black, purple, crimson, ancient magic]
    structure:
      opening: eye reveal in shadow
      middle: beauty showcase
      climax: controlled dark magic
      ending: hero title
    camera: [eye_reveal, beauty_showcase, hero_low_angle]
    action: [ability_preparation, ability_release]
    expression: [villain_pressure, elegant_smile]
    transition: [particle_reveal, title_reveal]
    risk: medium

  # ---- 活动 PV 主题 ----
  # 与角色 PV 的根本差异：卖点不是「认识一个新角色」，
  # 而是「参与一个限时事件」。因此结构、情绪曲线、CTA 均不同。

  - id: theme.anniversary.celebration.v1
    slug: anniversary-celebration
    name: Anniversary Celebration
    category: event_pv
    event_type: anniversary
    purpose: celebrate milestone and reactivate lapsed players
    commercial_goal: player_return
    emotion_arc: 回顾 → 感谢 → 展望
    visual_keywords: [golden, confetti, milestone number, ensemble, warm light]
    cast_oriented: true
    recommended_cast_size: 3
    structure:
      opening: 里程碑数字 / 周年标识
      middle: 阵容轮换（老角色回归感）
      climax: 全阵容列队
      ending: 周年标题 + 活动时间
    recommended_camera: [duo-formation, beauty-showcase, final-pose]
    recommended_action: [signature-pose, head-turn]
    recommended_expression: [sweet-smile, elegant-smile, composed-gaze]
    recommended_transition: [particle-reveal, title-reveal]
    palette_note: 暖金为主，区别于角色 PV 的冷峻或甜辣
    cta_required: true
    risk: high
    note: 阵容规模大，须遵守 cast-risk-rules 的稳定性封顶

  - id: theme.collaboration.event.v1
    slug: collaboration-event
    name: Collaboration Event
    category: event_pv
    event_type: collaboration
    purpose: cross-IP limited event
    commercial_goal: cross_audience_acquisition
    emotion_arc: 意外 → 融合 → 期待
    visual_keywords: [dual identity, crossover motif, limited seal, split composition]
    cast_oriented: true
    recommended_cast_size: 2
    structure:
      opening: 双方视觉符号碰撞
      middle: 各自阵营角色分镜
      climax: 跨阵营同框
      ending: 联动标题 + 限时标识
    recommended_camera: [split-frame-duo, duo-standoff, final-pose]
    recommended_action: [signature-pose, hand-gesture]
    recommended_expression: [confident-smirk, composed-gaze]
    recommended_transition: [flash-cut, ui-card, title-reveal]
    ip_safety: >
      本系统仅产出原创设计描述。联动 PV 中的对方 IP 元素
      须由用户自行提供授权素材，Prompt 中不得描述现有 IP 具体角色。
    cta_required: true
    risk: high

  - id: theme.seasonal.event.v1
    slug: seasonal-event
    name: Seasonal Event
    category: event_pv
    event_type: seasonal
    purpose: seasonal limited banner or costume event
    commercial_goal: cosmetic_conversion
    emotion_arc: 氛围 → 惊喜 → 号召
    visual_keywords: [season motif, festive props, limited costume, ambient color]
    cast_oriented: true
    recommended_cast_size: 2
    structure:
      opening: 季节氛围建立（环境优先，是唯一允许弱化角色开场的类型）
      middle: 限定造型展示
      climax: 角色互动 / 节日动作
      ending: 活动标题 + 限时标识
    recommended_camera: [environment-reveal, beauty-showcase, shoulder-to-shoulder]
    recommended_action: [hand-gesture, signature-pose]
    recommended_expression: [sweet-smile, playful-wink, idol-bright]
    recommended_transition: [particle-reveal, graphic-panel, title-reveal]
    seasonal_variants: [spring_bloom, summer_beach, autumn_harvest, winter_holiday]
    cta_required: true
    risk: medium

roadmap_v1_2:
  planned:
    - male-character-release
    - female-idol-release
    - villain-release
