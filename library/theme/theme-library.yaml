  # ---- 男性角色 Theme ----
  # 由 v1.2 引入：补足男性角色的专属商业身份。
  # 三类覆盖「西装 / 武士 / 骑士」，与男性 Persona 标签及
  # composed-gaze / battle-resolve / detached-stare 表情组件配合使用。

  - id: theme.male.suit.release.v1
    slug: male-suit-release
    name: Male Suit Character Release
    category: mobile_character_pv
    purpose: mature male character launch
    commercial_goal: character_acquisition
    character_type: male_mature
    commercial_position: [mature, refined, restrained power]
    visual_keywords: [black suit, tie, pocket square, tailored silhouette, sharp jawline]
    structure:
      opening: 领带 / 袖扣 / 胸针细节切入
      middle: 西装轮廓与侧身回眸
      climax: 松领带 / 整理袖口招牌动作
      ending: 角色标题 + 最终定格
    recommended_camera: [detail-macro, beauty-showcase, hero-low-angle, final-pose]
    recommended_action: [head-turn, confident-walk, hand-gesture, signature-pose]
    recommended_expression: [composed-gaze, detached-stare]
    recommended_transition: [graphic-panel, ui-card, title-reveal]
    style_hint: 深色电影感布光，克制光影，突出剪裁轮廓
    # 概念分解图规范矩阵（见 director/character-concept-sheet.md）
    concept_sheet:
      clothing_layers: [西装外套, 马甲, 衬衫, 平角内搭, 西裤, 牛津皮鞋]
      inner_layer_state: 脱去西装外套后展示马甲 + 衬衫（解领口、松领带）
      intimate_innerwear: [平角内裤, 袜子, 背心]
      expression_set: [composed-gaze, detached-stare, confident-smirk, impatient]
      material_closeups: [羊毛西装纹理, 袖扣金属反光, 皮鞋皮质]
      life_slice:
        bags: 公文包 / 邮差包打开：钢笔、名片夹、钱包、交通卡、充电宝
        care: [电动剃须刀, 发蜡, 古龙水]
        private: [复古机械表, 限量打火机, 雪茄剪]
    risk: low

