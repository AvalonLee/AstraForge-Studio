execution:
  pipeline:
    - step0_session_spec
    - task_orchestration
    - character_intelligence
    - character_dna_lock
    - commercial_director
    - cast_resolution          # 单角色 -> character_dna / 多角色 -> cast
    - genre_selection
    - theme_engine
    - variation_engine
    - style_stack
    - risk_budget_gate
    - composer
    - library_matching
    - shot_planning
    - prompt_structure_validation
    - h3_prompt_engine
    - quality_check
    - auto_revision
    - generation_gate
    - output_package

  session_spec:
    required_before_generation: true
    fields:
      - duration
      - aspect_ratio

  generation_gate:
    require_explicit_user_confirmation: true
    note: system outputs prompts and parameters only, never invokes generation

  fallback:
    missing_style: modern-cel
    missing_duration: 15s
    missing_pv_mode: 15s_release
    missing_genre: daily
    style_conflict_resolution: remove_conflicting_style
    insufficient_character_info: request_clarification

  quality_first:
    generation_stability: 35
    character_consistency: 25
    shot_feasibility: 15
    visual_impact: 10
    commercial_value: 10
    art_direction: 5

  cast_resolution:
    single: core/character-dna/dna-schema.yaml
    multi: core/multi-character/cast-schema.yaml
    max_cast_size: 4
    composer_by_mode:
      single: director/pv-composer.md
      duo: director/multi-character-composer.md
      trio: director/multi-character-composer.md
      event: director/event-director.md
    gates:
      contrast_requirement: 任意两成员至少 2 维强对比，否则拒绝
      weight_rule: sum(screen_weight)==70 且 lead>=second*1.5
      action_amplification: effective_level = base + (in_frame - 1)
    stability_cap_by_cast_size: { 1: 35, 2: 32, 3: 28, 4: 24 }

  event_pv:
    types: [anniversary, collaboration, seasonal]
    cta_required: true
    cta_must_include: [活动名称, 时间信息]
    director: director/event-director.md

  risk_budget_gate:
    position: after_theme_and_genre_selection, before_composer
    principle: theme recommendations are candidates, not decisions
    formula: min(genre_limit, duration_limit)
    spec: core/quality-engine/risk-budget-gate.yaml

  risk_limits:
    max_action_level_5s: 1
    max_action_level_15s: 2
    max_action_level_30s: 3
    max_effect_level_15s: 2
    max_effect_level_legendary: 3
    max_camera_transition_5s: 4
    max_camera_transition_10s: 6
    max_camera_transition_15s: 9
    max_camera_transition_30s: 15
    hero_shot_min_5s: 1
    hero_shot_min_15s: 2
    hero_shot_min_30s: 3

  genre_action_limits:
    action: 2
    daily: 2
    magic: 2
  genre_ceiling_uplift:
    - { genre: magic,  when: { duration: 30s, rarity: SSR }, action_limit: 3 }
    - { genre: action, when: { duration: 30s },              action_limit: 3 }

  genre_params:
    action:
      shot_duration: 0.3-0.8s
      push_speed: 0.4/s
      shake: 8-12px / 0.2-0.5s on hit only
      bpm: 140-160
    daily:
      shot_duration: 0.8-1.5s
      push_speed: 0.2/s (max 1 per PV)
      pan_speed: "<=0.25deg/s"
      shake: none
      bpm: 100-120
    magic:
      charge_duration: 1.5-2.5s
      burst_duration: 0.3-0.8s
      orbit_angle: 30-45deg
      burst_shake: 5-8px
      bpm: 120-140
    poster_mg:
      duration: 20s
      shot_duration: 0.3-0.8s              # 高密度蒙太奇切镜
      character_screen_share: 0.7          # 角色占比约70%，相对稳定（定格+侧面平移）
      bg_graphic_motion: high_speed_reverse_scroll   # 背景Graphic高速反向滚动
      silhouette_cel_morph_window: 0-6s    # 剪影↔赛璐璐切换固定开场窗
      montage_window: 9-15s                # MG蒙太奇段
      montage_density:                    # 蒙太奇密度（量化）
        total_cuts: 8-20                   # 6s窗口内总切镜数
        avg_cut: 0.3-0.8s
        rule: key_pose_hold_no_continuous_action   # 关键姿态定格，不连续动作
      inversion_trigger: per_beat          # 每次鼓点/魔术触发→反相/单帧闪红闪白/几何拆解
      inversion_frequency:                 # 反相触发频率（量化）
        during_montage: 1 per 0.4-0.5s     # ≈每拍一次（bpm120-140 → 0.43-0.5s/拍）
        types: [black_white_invert, single_frame_red_flash, single_frame_white_flash, geometric_deconstruct]
      transition: graphic_match_only       # 禁止淡入淡出/空白过渡
      bpm: 120-140
      risk_control: character_static_bg_dynamic

  h3_output:
    base_modes: [T2VA, I2VA, FL2VA, L2VA]
    base_fields:
      - integrated_multimodal_description
      - overall_soundscape
      - non_diegetic_music
    ref2va_fields:
      - subject_definitions
      - summary
      - retention_analysis
      - detailed_description
      - overall_soundscape
      - non_diegetic_music
    shot_elements:
      - composition
      - subjects
      - environment
      - actions
      - camera
      - sound
    language: english for rewrite sections, preserve original for dialogue and on-screen text
